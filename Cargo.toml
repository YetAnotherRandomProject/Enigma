[workspace]
resolver = "3"
members = ["crates/core", "crates/graph", "crates/typeset", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
enigma-core = { path = "crates/core" }
enigma-graph = { path = "crates/graph" }
enigma-typeset = { path = "crates/typeset" }

anyhow = "1.0.104"
# Presse-papiers (fichiers et images collés) ; déjà dans l'arbre via egui-winit, mêmes fonctions.
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
# Police d'emoji embarquée : icônes des packs (🚪, 🔎…) lisibles sur tous les OS.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
# Chargeurs d'images d'egui (PNG/JPEG/GIF/WebP via image, SVG via resvg, fichiers locaux).
egui_extras = { version = "0.37.0", default-features = false, features = ["file", "image", "svg", "gif", "webp"] }
# Formats PNG et JPEG pour egui_extras ; déjà présent dans l'arbre (arboard).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
notify-debouncer-full = "0.7.0"
# Export PNG du graphe ; déjà présent dans l'arbre via egui/epaint (même version).
png = "0.18.1"
pulldown-cmark = { version = "0.13.6", default-features = false }
# Recherche par expression régulière ; regex-automata et regex-syntax sont déjà dans l'arbre.
regex = "1.13.2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
# Mise à jour automatique : empreinte des fichiers téléchargés.
sha2 = "0.11.1"
# Mise à jour automatique : remplacement de l'exécutable en cours (Windows compris).
self-replace = "1.5.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
# Mise à jour automatique : requêtes HTTPS vers l'API et les fichiers GitHub (rustls, sans OpenSSL).
ureq = "3.5.2"
walkdir = "2.5.0"

# Exécutable publié plus petit et plus rapide (téléchargé par la mise à jour
# automatique) : optimisation à l'édition de liens, symboles retirés.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
