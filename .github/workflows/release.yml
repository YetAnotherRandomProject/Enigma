# Publication d'une version : pousser une étiquette `vX.Y.Z` (égale à la
# version de `Cargo.toml`) construit les exécutables et crée la « Release »
# GitHub. La mise à jour automatique de l'application télécharge ces
# fichiers (noms fixes, voir crates/app/src/update.rs) et vérifie leur
# empreinte `.sha256`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Version de l'étiquette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: L'étiquette correspond à Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Étiquette ${GITHUB_REF_NAME} différente de la version v$version de Cargo.toml"
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: enigma-windows-x86_64.exe
            binary: enigma.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: enigma-linux-x86_64
            binary: enigma
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: enigma-macos-aarch64
            binary: enigma
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: enigma-macos-x86_64
            binary: enigma
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Compilation
        run: cargo build --release --locked -p enigma-app --target ${{ matrix.target }}
      - name: Fichier publié et empreinte SHA-256
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
